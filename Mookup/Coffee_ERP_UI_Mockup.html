:root{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Almarai',sans-serif;color:var(--ink);background:var(--espresso);}
.brand-font{font-family:'Reem Kufi',sans-serif;}
button,input{font-family:inherit;}

.app{display:flex; height:100vh; overflow:hidden;}

/* ---------------- Sidebar ---------------- */
.sidebar{
  width:280px; flex:none; background:var(--espresso); color:var(--paper);
  display:flex; flex-direction:column; border-left:1px solid #26374E;
}
.side-brand{ display:flex; align-items:center; gap:12px; padding:20px 18px 16px; border-bottom:1px solid #26374E;}

.side-brand h1{font-family:'Reem Kufi',sans-serif;font-size:17px;margin:0;}
.side-brand span{display:block;font-size:11px;color:#93A6B8;margin-top:2px;}
.side-count{font-size:11px;color:#7C90A3;padding:10px 18px;border-bottom:1px solid #26374E;}
.side-count b{color:var(--gold);}
.nav-scroll{flex:1; overflow-y:auto; padding:10px 10px 20px;}
.lang-toggle-foot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid #26374E;font-size:11px;color:#7C90A3;}
.lang-toggle-foot button{background:transparent;border:1px solid #2C3F58;color:#C3D0DC;border-radius:6px;padding:5px 11px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;}
.lang-toggle-foot button:hover{border-color:var(--rust);color:var(--gold);}
.nav-group{margin-bottom:4px;}
.nav-group-title{font-size:11.5px;font-weight:800;color:#7C90A3;padding:14px 10px 6px;}
.nav-item{
  display:block;width:100%;text-align:right;background:transparent;border:none;color:#C3D0DC;
  font-size:13px;padding:8px 12px;border-radius:7px;cursor:pointer;margin-bottom:2px;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--paper); color:var(--ink); font-weight:800;}

/* ---------------- Main ---------------- */
.main{flex:1; overflow-y:auto; background:var(--paper);}
.app-topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 26px;background:var(--white);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.app-topbar .right{display:flex;flex-direction:column;gap:4px;}
.app-topbar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.crumb{font-size:11.5px;color:var(--ink-faint);font-weight:700;}
h2.screen-title{font-family:'Reem Kufi',sans-serif;font-size:19px;margin:2px 0 0;color:var(--ink);}
h2.screen-title small{display:block;font-family:'Almarai',sans-serif;font-weight:400;font-size:12.5px;color:var(--ink-faint);margin-top:4px;}

.btn{font-weight:800;font-size:13px;border-radius:8px;padding:9px 16px;border:1px solid var(--border);background:var(--white);color:var(--ink);cursor:pointer;}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--rust);border-color:var(--rust);color:#fff;}
.btn.primary:hover{background:var(--rust-deep);}
.btn.ghost{background:transparent;}

.content-pad{padding:22px 26px 50px;}
.badge{font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;white-space:nowrap;}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink);}
.badge.warn{background:var(--warn-bg);color:var(--warn-ink);}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink);}
.badge.neu{background:var(--neu-bg);color:var(--neu-ink);}

/* list screens */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.search-box{border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;color:var(--ink-faint);background:#fff;min-width:220px;}
table.dtable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13.2px;}
table.dtable thead th{text-align:right;background:var(--paper-dim);color:var(--ink-soft);font-weight:800;font-size:12px;padding:11px 14px;border-bottom:1px solid var(--border);}
table.dtable td{padding:12px 14px;border-bottom:1px solid var(--paper-dim);color:var(--ink);}
table.dtable tbody tr:last-child td{border-bottom:none;}
table.dtable tbody tr:hover{background:#FCFAF4;}
table.dtable tbody tr.clickable-row{cursor:pointer;}
table.dtable tbody tr.clickable-row:hover{background:var(--paper-dim);}

/* doc screens */
.fields-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.field{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:#fff;}
.field .f-label{font-size:11.5px;color:var(--ink-faint);font-weight:700;}
.field .f-value{font-size:14px;font-weight:800;margin-top:4px;}
table.lines{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
table.lines th{text-align:right;background:var(--paper-dim);font-weight:700;color:var(--ink-soft);padding:9px 10px;}
table.lines td{padding:11px 10px;border-bottom:1px solid var(--paper-dim);}
table.lines tr:last-child td{border-bottom:none;}
.totals-strip{display:flex;justify-content:flex-end;gap:26px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);flex-wrap:wrap;}
.totals-strip .t-item{text-align:left;}
.totals-strip .t-label{font-size:11.5px;color:var(--ink-faint);}
.totals-strip .t-value{font-size:15px;font-weight:800;margin-top:2px;}
.totals-strip .t-item.strong .t-value{color:var(--rust);font-size:19px;}
.cost-summary{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;}
.cost-box{flex:1;min-width:170px;background:var(--espresso);color:var(--paper);border-radius:10px;padding:15px 17px;}
.cost-box .c-label{font-size:11.5px;color:#93A6B8;}
.cost-box .c-value{font-family:'Reem Kufi',sans-serif;font-size:19px;margin-top:6px;}
.cost-box.accent{background:var(--rust-deep);}
.cost-box.accent .c-label{color:#F2E7C9;}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.kpi{border:1px solid var(--border);border-radius:10px;padding:16px;background:#fff;border-top:3px solid var(--rust);}
.kpi:nth-child(2){border-top-color:var(--olive);}
.kpi:nth-child(3){border-top-color:var(--gold);}
.kpi:nth-child(4){border-top-color:var(--espresso);}
.kpi .k-label{font-size:12px;color:var(--ink-faint);font-weight:700;}
.kpi .k-value{font-family:'Reem Kufi',sans-serif;font-size:23px;margin-top:8px;}
.kpi .k-note{font-size:11.5px;color:var(--olive-deep);margin-top:6px;}
.kpi .k-note.bad{color:var(--rust-deep);}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.panel{border:1px solid var(--border);border-radius:10px;background:#fff;padding:16px 18px;}
.panel h4{font-family:'Reem Kufi',sans-serif;font-size:14.5px;margin:0 0 14px;}
.barlist{display:flex;flex-direction:column;gap:12px;}
.barrow{display:flex;align-items:center;gap:10px;font-size:13px;}
.barrow .b-label{width:110px;flex:none;color:var(--ink-soft);font-weight:700;}
.barrow .b-track{flex:1;background:var(--paper-dim);border-radius:5px;height:10px;overflow:hidden;}
.barrow .b-fill{height:100%;background:var(--rust);border-radius:5px;}
.barrow .b-val{width:76px;flex:none;text-align:left;font-weight:800;color:var(--ink);font-size:12.5px;}

/* POS */
.pos{display:grid;grid-template-columns:1fr 340px;min-height:600px;}
.pos-main{padding:18px 22px;border-left:1px solid var(--border);}
.order-type{display:flex;gap:8px;margin:14px 0 16px;}
.order-type button{flex:1;font-weight:800;font-size:13px;padding:10px 8px;border-radius:8px;border:1px solid var(--border);background:var(--paper-dim);color:var(--ink-soft);cursor:pointer;}
.order-type button.on{background:var(--espresso);border-color:var(--espresso);color:var(--paper);}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border);}
.cat-tabs button{font-weight:700;font-size:13px;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
.cat-tabs button.on{background:var(--olive);border-color:var(--olive);color:#fff;}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.product-card{text-align:right;border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:96px;transition:border-color .12s ease, transform .12s ease;}
.product-card:hover{border-color:var(--rust);transform:translateY(-2px);}
.product-card .p-name{font-weight:800;font-size:14.5px;}
.product-card .p-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.product-card .p-price{font-weight:800;font-size:14px;color:var(--rust);align-self:flex-start;}
.cart-panel{background:var(--espresso);color:var(--paper);display:flex;flex-direction:column;padding:18px 16px;}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.cart-head h3{font-family:'Reem Kufi',sans-serif;font-size:15px;margin:0;}
.cart-head span{font-size:11.5px;color:#93A6B8;}
.cart-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;min-height:180px;}
.cart-row{background:var(--espresso-soft);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;animation:rowin .18s ease;}
@keyframes rowin{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
.cart-row .ci-name{font-weight:700;}
.cart-row .ci-sub{color:#92A5B7;font-size:11px;}
.cart-row .ci-price{color:var(--gold);font-weight:800;white-space:nowrap;}
.cart-totals{border-top:1px solid #2C3F58;padding-top:12px;font-size:13.5px;}
.cart-totals .row{display:flex;justify-content:space-between;padding:4px 0;color:#B7C6D4;}
.cart-totals .row.total{color:#fff;font-weight:800;font-size:17px;border-top:1px dashed #2C3F58;margin-top:6px;padding-top:10px;}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.pay-grid button{font-weight:800;font-size:13px;padding:12px 6px;border-radius:8px;border:1px solid #2C3F58;background:#1F2E44;color:var(--paper);cursor:pointer;}
.pay-grid button.confirm{grid-column:1/-1;background:var(--rust);border-color:var(--rust);padding:13px;font-size:14.5px;}

/* tables screen */
.tables-full{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
.tchip-lg{border-radius:10px;padding:16px 10px;text-align:center;color:#fff;font-weight:800;cursor:pointer;border:none;}
.tchip-lg .tn{font-family:'Reem Kufi',sans-serif;font-size:16px;}
.tchip-lg .ts{font-size:11px;font-weight:400;opacity:.85;display:block;margin-top:4px;}
.tchip-lg.free{background:var(--olive);}
.tchip-lg.busy{background:var(--rust);}
.tchip-lg.clean{background:var(--ink-faint);}
.legend-row{display:flex;gap:18px;margin-bottom:18px;font-size:12.5px;color:var(--ink-soft);}
.legend-row span{display:flex;align-items:center;gap:6px;}
.legend-row .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* shift close */
.shift{display:grid;grid-template-columns:1fr 300px;gap:20px;}
.shift-rows{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.srow{display:flex;justify-content:space-between;padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--paper-dim);}
.srow:last-child{border-bottom:none;}
.srow .s-label{color:var(--ink-soft);}
.srow .s-value{font-weight:800;}
.srow.section{background:var(--paper-dim);font-weight:800;color:var(--ink);}
.srow.diff .s-value{color:var(--rust-deep);}
.donut-wrap{display:flex;flex-direction:column;align-items:center;padding:18px;border:1px solid var(--border);border-radius:10px;background:#fff;}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--rust) 0 48%, var(--olive) 48% 74%, var(--gold) 74% 100%);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.donut-hole{width:92px;height:92px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-hole b{font-family:'Reem Kufi',sans-serif;font-size:16px;}
.donut-hole span{font-size:10.5px;color:var(--ink-faint);}
.legend{width:100%;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.legend div{display:flex;justify-content:space-between;align-items:center;}
.legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:8px;}

.meta-pill{font-size:12.5px;color:var(--ink-soft);background:var(--paper-dim);border:1px solid var(--border);padding:5px 12px;border-radius:20px;}
.meta-pill b{color:var(--ink);font-weight:800;}

/* ---------------- شاشات الإنشاء (Create Screens) — صفحة كاملة بمستوى ERP ---------------- */
.create-header{position:sticky;top:0;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 26px;background:var(--white);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.create-header .crumb{font-size:11.5px;color:var(--ink-faint);font-weight:700;}
.create-header .left{display:flex;gap:10px;}
.create-body{display:flex;gap:0;align-items:flex-start;}
.create-jumpnav{position:sticky;top:78px;flex:none;width:190px;padding:22px 14px;display:flex;flex-direction:column;gap:2px;}
.create-jumpnav a{font-size:12.5px;color:var(--ink-faint);font-weight:700;text-decoration:none;padding:7px 10px;border-radius:7px;}
.create-jumpnav a:hover{background:var(--paper-dim);color:var(--ink);}
.create-form{flex:1;max-width:760px;padding:22px 26px 60px;}
.cform-section{border-bottom:1px solid var(--paper-deep);padding:22px 0;scroll-margin-top:90px;}
.cform-section:first-child{padding-top:0;}
.cform-section:last-child{border-bottom:none;}
.cform-section h3{font-family:'Reem Kufi',sans-serif;font-size:15px;margin:0 0 4px;}
.cform-section .section-note{font-size:12px;color:var(--ink-faint);margin-bottom:16px;}
.cform-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:14px;}
.cform-field.full{grid-column:1/-1;}
.cform-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.cform-field input, .cform-field select, .cform-field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);}
.cform-field input:focus, .cform-field select:focus, .cform-field textarea:focus{outline:2px solid var(--rust);outline-offset:1px;}
.field-help{font-size:11px;color:var(--ink-faint);margin-top:5px;line-height:1.5;}
.switch-row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--paper-dim);}
.switch-row:last-child{border-bottom:none;}
.switch-row .switch-label{font-size:13.5px;font-weight:700;color:var(--ink);}
.switch-row .switch-help{font-size:11.5px;color:var(--ink-faint);margin-top:3px;max-width:480px;line-height:1.5;}
.switch{display:inline-block;position:relative;width:42px;height:24px;flex:none;vertical-align:middle;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch input[type="checkbox"]{opacity:0!important;width:0!important;height:0!important;position:absolute!important;margin:0!important;padding:0!important;border:none!important;}
.switch .slider{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:background .15s;}
.switch .slider:before{content:'';position:absolute;width:18px;height:18px;right:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + .slider{background:var(--olive);}
.switch input:checked + .slider:before{transform:translateX(-18px);}

/* قيد اليومية — سطور مدين/دائن حقيقية */
.jrow-table{width:100%;border-collapse:collapse;margin-top:8px;}
.jrow-table th{text-align:right;font-size:11.5px;color:var(--ink-faint);font-weight:700;padding:6px 8px;}
.jrow-table td{padding:6px 6px;}
.jrow-table input, .jrow-table select{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;font-family:inherit;}
.jbal-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 16px;border-radius:9px;background:var(--paper-dim);font-size:13px;}
.jbal-bar.balanced{background:var(--ok-bg);color:var(--ok-ink);}
.jbal-bar.unbalanced{background:var(--bad-bg);color:var(--bad-ink);}
.jbal-bar b{font-family:'Reem Kufi',sans-serif;font-size:14px;}
.add-row-btn{margin-top:10px;font-size:12.5px;font-weight:800;background:transparent;border:1px dashed var(--ink-faint);border-radius:7px;padding:8px 14px;cursor:pointer;color:var(--ink-soft);}
.add-row-btn:hover{border-color:var(--rust);color:var(--rust);}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--espresso);color:var(--paper);padding:12px 22px;border-radius:9px;font-size:13.5px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;transition:opacity .2s ease;}
.toast.show{opacity:1;}

/* ---------------- Kanban (KDS / طلبات الدليفري) ---------------- */
.kanban-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;}
.kanban-col{flex:1;min-width:230px;background:var(--paper-dim);border-radius:10px;padding:14px;}
.kanban-col h4{font-family:'Reem Kufi',sans-serif;font-size:13px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);}
.kanban-col h4 .count{background:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:800;color:var(--ink);}
.kticket{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .1s ease,border-color .1s ease;}
.kticket:hover{transform:translateY(-2px);border-color:var(--rust);}
.kticket .kt-top{display:flex;justify-content:space-between;align-items:center;}
.kticket .kt-id{font-weight:800;font-size:13px;}
.kticket .kt-meta{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.kticket .kt-items{font-size:12px;color:var(--ink-soft);margin-top:9px;line-height:1.7;border-top:1px dashed var(--paper-deep);padding-top:8px;}
.kticket .kt-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
.kticket .kt-time{font-size:10.5px;color:var(--ink-faint);}
.platform-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:12px;}
.platform-badge.internal{background:var(--paper-deep);color:var(--ink-soft);}
.platform-badge.talabat{background:#FFE3D6;color:#B23B0E;}
.platform-badge.elmenus{background:#DCEBFA;color:#1B5E93;}
.kticket-advance{font-size:11px;font-weight:800;color:var(--rust);background:none;border:none;cursor:pointer;padding:0;}

/* ---------------- مخزون حي (POS ديناميكي) ---------------- */
.stock-mini{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);}
.stock-mini .sm-title{font-size:12px;font-weight:800;color:var(--ink-faint);margin-bottom:10px;}
.stock-row{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:8px;}
.stock-row .sr-label{width:118px;flex:none;color:var(--ink-soft);font-weight:700;}
.stock-row .sr-track{flex:1;background:var(--paper-dim);border-radius:5px;height:8px;overflow:hidden;}
.stock-row .sr-fill{height:100%;border-radius:5px;transition:width .2s ease;}
.stock-row .sr-fill.ok{background:var(--olive);}
.stock-row .sr-fill.low{background:var(--gold);}
.stock-row .sr-fill.out{background:var(--rust);}
.stock-row .sr-val{width:64px;text-align:left;font-weight:800;font-size:11px;}
.dispense-toggle{display:flex;gap:6px;margin-bottom:14px;}
.dispense-toggle button{font-size:12px;font-weight:800;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink-soft);cursor:pointer;}
.dispense-toggle button.on{background:var(--espresso);border-color:var(--espresso);color:var(--paper);}
.pos-alert{background:var(--bad-bg);color:var(--bad-ink);border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;margin-top:10px;display:none;}
.pos-alert.show{display:block;}
.batch-pill{background:var(--gold);color:#2A3B52;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;}

/* ---------------- تقارير تفاعلية ---------------- */
.report-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
.rf-field{display:flex;flex-direction:column;gap:5px;}
.rf-field label{font-size:11px;color:var(--ink-faint);font-weight:700;}
.rf-field select, .rf-field input{border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;font-family:inherit;background:#fff;}

/* ---------------- مرفقات ---------------- */
.attach-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.attach-chip{display:flex;align-items:center;gap:6px;background:var(--paper-dim);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:11.5px;color:var(--ink-soft);}
.attach-add{background:transparent;border:1px dashed var(--ink-faint);border-radius:20px;padding:6px 13px;font-size:11.5px;font-weight:800;color:var(--ink-soft);cursor:pointer;}
.attach-add:hover{border-color:var(--rust);color:var(--rust);}

/* ---------------- زرار تعديل صف ---------------- */
.row-edit-btn{font-size:11.5px;font-weight:800;color:var(--rust);background:transparent;border:1px solid var(--rust);border-radius:6px;padding:5px 11px;cursor:pointer;}
.row-edit-btn:hover{background:var(--rust);color:#fff;}

/* ---------------- مطابقة بنكية تفاعلية ---------------- */
.recon-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.recon-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--paper-dim);font-size:13px;}
.recon-row:last-child{border-bottom:none;}
.recon-row.matched{opacity:.45;}
.recon-row .rc-desc{flex:1;}
.recon-row .rc-date{color:var(--ink-faint);font-size:11px;}
.recon-row .rc-amt{font-weight:800;white-space:nowrap;}
.recon-summary{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;}

.tree-toggle{background:transparent;border:none;cursor:pointer;font-size:10px;color:var(--ink-faint);width:16px;display:inline-block;text-align:center;}
.tree-toggle:hover{color:var(--rust);}

/* ---------------- شاشة تسجيل الدخول (ثنائية اللغة) ---------------- */
.login-gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--espresso),#0F1A29);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.login-card{background:var(--paper);width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:0 40px 80px -20px rgba(0,0,0,.6);}
.login-head{background:var(--espresso);padding:28px 30px 22px;text-align:center;position:relative;}
.login-lang-pill{position:absolute;top:16px;inset-inline-end:16px;background:rgba(255,255,255,.08);border:1px solid #2C3F58;border-radius:20px;padding:5px 13px;font-size:11px;font-weight:800;color:#C3D0DC;cursor:pointer;}
.login-lang-pill:hover{border-color:var(--rust);color:var(--gold);}
.login-logo{width:64px;height:64px;border-radius:14px;margin:0 auto 12px;background-size:cover;background-position:center;}
.login-head h2{font-family:'Reem Kufi',sans-serif;color:#fff;font-size:19px;margin:0;}
.login-head p{color:#93A6B8;font-size:12px;margin:6px 0 0;}
.login-body{padding:26px 30px 30px;}
.login-field{margin-bottom:16px;}
.login-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.login-field input, .login-field select{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);}
.login-field input:focus, .login-field select:focus{outline:2px solid var(--rust);outline-offset:1px;}
.login-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:12.5px;}
.login-row label{display:flex;align-items:center;gap:7px;color:var(--ink-soft);cursor:pointer;}
.login-row a{color:var(--rust-deep);text-decoration:none;font-weight:700;}
.login-row a:hover{text-decoration:underline;}
.login-submit{width:100%;background:var(--rust);border:none;color:#fff;font-weight:800;font-size:14.5px;padding:13px;border-radius:10px;cursor:pointer;font-family:inherit;}
.login-submit:hover{background:var(--rust-deep);}
.login-footer{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:20px;}

@media (max-width:1000px){
  .kpis, .fields-grid{grid-template-columns:repeat(2,1fr);}
  .dash-grid, .shift{grid-template-columns:1fr;}
  .pos{grid-template-columns:1fr;}
  .product-grid{grid-template-columns:repeat(2,1fr);}
  .tables-full{grid-template-columns:repeat(3,1fr);}
  .sidebar{width:230px;}
}

const navScroll = document.getElementById('navScroll');

let APP_LANG = 'ar';
let CURRENT_SCREEN_ID = 'dashboard';
const GROUP_NAME_EN = {
  'الرئيسية':'Home', 'إعدادات النماذج والحدود':'Production & Limits Settings', 'الحسابات العامة':'General Accounts',
  'المخازن والتصنيع':'Inventory & Manufacturing', 'المشتريات':'Purchasing', 'المبيعات':'Sales',
  'نقاط البيع POS':'Point of Sale', 'الامتثال الضريبي (ETA)':'Tax Compliance (ETA)',
  'الإعدادات والصلاحيات':'Settings & Permissions', 'الصيانة وإدارة الأعطال':'Maintenance', 'التقارير':'Reports',
};
function buildSidebar(){
  navScroll.innerHTML = '';
  let n = 0;
  GROUPS.forEach(g=>{
    const gd = document.createElement('div'); gd.className='nav-group';
    const gt = document.createElement('div'); gt.className='nav-group-title';
    gt.textContent = APP_LANG==='en' ? (GROUP_NAME_EN[g.name]||g.name) : g.name;
    gd.appendChild(gt);
    g.items.forEach(id=>{
      n++;
      const item = DB[id];
      const btn = document.createElement('button');
      btn.className='nav-item'+(id===CURRENT_SCREEN_ID?' active':''); btn.textContent=item.title; btn.dataset.id=id;
      btn.addEventListener('click', ()=> openScreen(id));
      gd.appendChild(btn);
    });
    navScroll.appendChild(gd);
  });
  totalScreens = n;
  document.getElementById('screenCount').textContent = totalScreens;
}
buildSidebar();
function toggleAppLang(){
  APP_LANG = APP_LANG==='ar' ? 'en' : 'ar';
  document.documentElement.dir = APP_LANG==='ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = APP_LANG;
  document.getElementById('appLangBtn').textContent = APP_LANG==='ar' ? 'AR / EN' : 'EN / AR';
  document.querySelector('.side-brand span').textContent = APP_LANG==='ar' ? 'قهوة … تبسطك' : 'Coffee … that pleases you';

    : 'Switched to English — navigation & framework only in this demo; screen content stays Arabic for now');
}

/* ===================== عرض الشاشة ===================== */
const mainArea = document.getElementById('mainArea');

function topbar(cfg, actionsHTML){
  return `<div class="app-topbar">
    <div class="right"><div class="crumb">${cfg.crumb}</div>
      <h2 class="screen-title">${cfg.title}${cfg.subtitle?`<small>${cfg.subtitle}</small>`:''}</h2>
    </div>
    <div class="left">${cfg.badge?`<span class="badge ${badgeClass(cfg.badge)}">${cfg.badge}</span>`:''}${actionsHTML||''}</div>
  </div>`;
}

function renderList(cfg, id){
  const actions = (cfg.action?`<button class="btn primary" onclick="openCreatePage('${id}')">${cfg.action}</button>`:'')+`<input class="search-box" placeholder="بحث سريع...">`;
  let rows;
  if(cfg.records){
    const schema = FORM_SCHEMAS[id];
    rows = cfg.records.map((rec,idx)=>{
      const cells = schema.rowFrom(rec).map(cell=>`<td>${cell}</td>`).join('');
      return `<tr class="clickable-row" onclick="openRowDetail('${id}',${idx})">${cells}</tr>`;
    }).join('');
  } else {
    rows = cfg.rows.map((r,idx)=>`<tr class="clickable-row" onclick="openRowDetail('${id}',${idx})">${r.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('');
  }
  const table = `<table class="dtable"><thead><tr>${cfg.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody id="tbody-${id}">${rows}</tbody></table>`;
  return topbar(cfg, actions) + `<div class="content-pad">${table}</div>`;
}

/* فتح تفاصيل أي سطر من أي شاشة قائمة — عرض السجل كاملاً */
function openRowDetail(id, idx){
  if(id==='journal'){ openJournalRow(idx); return; }
  if(id==='receiptVoucher' || id==='paymentVoucher'){ openVoucherRow(id, idx); return; }
  if(id==='custodyRegister'){ openCustodyRegRow(idx); return; }
  if(id==='stockIn' || id==='stockOut' || id==='stockTransfer' || id==='transferOrder'){ renderWHDocCreate(id, idx); return; }
  if(id==='transferReceive'){ renderTransferReceiveCreate(idx); return; }
  if(id==='branchRequest'){ renderBranchRequest(idx); return; }
  const cfg = DB[id];
  if(cfg.records){ openEditPage(id, idx); return; }
  const rowValues = cfg.rows[idx];
  const fieldsHTML = cfg.columns.map((col,i)=>`<div class="field"><div class="f-label">${col}</div><div class="f-value">${rowValues[i]!==undefined?rowValues[i]:'—'}</div></div>`).join('');
  mainArea.innerHTML = `
    <div class="app-topbar"><div class="right"><div class="crumb">${cfg.crumb} <span style="opacity:.5">/</span> ${cfg.title}</div><h2 class="screen-title">تفاصيل السجل<small>${cfg.title}</small></h2></div>
      <div class="left"><button class="btn" onclick="openScreen('${id}')">‹ رجوع للقائمة</button></div></div>
    <div class="content-pad"><div class="fields-grid">${fieldsHTML}</div></div>`;
  mainArea.scrollTop = 0;
}

/* فتح قيد من القائمة — بنفس شكل شاشة الإنشاء لو قابل للتعديل، أو عرض للقراءة فقط + قيد عكسي لو مرحّل/آلي */
function openJournalRow(idx){
  const row = DB.journal.rows[idx];
  const statusText = String(row[7]);
  const typeText = String(row[4]);
  const isDraft = statusText.includes('مسودة');
  const isManual = typeText.includes('يدوي');
  if(isDraft && isManual){
    renderJournalCreate(idx);
  } else {
    renderJournalReadOnly(idx);
  }
}
function renderJournalReadOnly(idx){
  const cfg = DB.journal;
  const row = cfg.rows[idx];
  const fieldsHTML = cfg.columns.map((col,i)=>`<div class="field"><div class="f-label">${col}</div><div class="f-value">${row[i]}</div></div>`).join('');
  const lockMsg = String(row[4]).includes('آلي')
    ? '🔒 هذا قيد آلي ناتج من موديول آخر — لا يمكن تعديله أو حذفه، فقط عكسه بقيد عكسي جديد.'
    : '🔒 هذا القيد مُرحّل بالفعل — لا يمكن تعديله بعد الترحيل، فقط عكسه بقيد عكسي جديد.';
  mainArea.innerHTML = `
    <div class="app-topbar"><div class="right"><div class="crumb">الحسابات العامة / القيود اليومية</div><h2 class="screen-title">تفاصيل القيد<small>${row[0]}</small></h2></div>
      <div class="left"><button class="btn" onclick="openScreen('journal')">‹ رجوع للقائمة</button><button class="btn primary" onclick="createReversalEntry(${idx})">إنشاء قيد عكسي</button></div></div>
    <div class="content-pad">

function parseAnyDateToInput(str){
  if(!str) return '';
  let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(str.trim());
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = /^(\d{1,2})\/(\d{1,2})$/.exec(str.trim());
  if(m) return `2026-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function formatInputDateToDisplay(iso){
  if(!iso) return '31/08/2026';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

    const el = document.getElementById('stock-'+slug(name)); if(!el) return;
    const pct = Math.max(0, Math.round((POS_STATE.stockedGoods[name]/POS_STATE.stockedMax[name])*100));
    const fill = el.querySelector('.sr-fill'), val = el.querySelector('.sr-val');
    fill.style.width = pct+'%'; fill.className = 'sr-fill ' + (pct<=0?'out':pct<25?'low':'ok');
    val.textContent = Math.max(0,POS_STATE.stockedGoods[name]) + ' قطعة';
  });

  if(pill){ pill.style.display = BATCH_QUEUE.length? 'inline' : 'none'; document.getElementById('batchPendingCount').textContent = BATCH_QUEUE.length; }

function addToCartDynamic(name){
  const recipe = RECIPES[name];
  const orderTag = (document.querySelector('.order-type button.on')?.dataset.order)||'صالة';

  if(recipe.mode==='stocked'){
    if((POS_STATE.stockedGoods[name]||0) <= 0){
      showPosAlert(`🚫 نفدت الكمية من "${name}" بمخزون المنتجات الجاهزة — البيع ممنوع (سياسة النموذج المخزني: منع البيع)`);
      return;
    }
    POS_STATE.stockedGoods[name]--;
    appendCartRow(name, recipe.price, `${orderTag} · صرف من مخزون جاهز`);
    updateStockPanel();
    return;
  }

  if(POS_STATE.dispenseMode==='realtime'){
    const missing = recipe.ingredients.find(([ing,qty])=> (POS_STATE.stock[ing]||0) < qty);
    if(missing){
      showPosAlert(`🚫 نقص مكون: "${missing[0]}" — لا يمكن إتمام البيع (سياسة النموذج اللحظي: منع البيع)`);
      return;
    }
    recipe.ingredients.forEach(([ing,qty])=> POS_STATE.stock[ing] -= qty);
    const invId = 'POS-'+Math.floor(Math.random()*900+3300);
    const consumedText = recipe.ingredients.map(([ing,qty])=>`${ing} ${qty}${UNIT_FOR[ing]}`).join('، ');
    DB.momentaryLog.rows.unshift([invId, name, consumedText, (recipe.price*0.34).toFixed(2)+' ج.م', nowTimeStr()]);
    appendCartRow(name, recipe.price, `${orderTag} · صرف لحظي من المكونات`);
    updateStockPanel();
  } else {
    recipe.ingredients.forEach(([ing,qty])=> BATCH_QUEUE.push({item:name, ingredient:ing, qty, unit:UNIT_FOR[ing], invoice:'قيد الفتح — POS-3311'}));
    appendCartRow(name, recipe.price, `${orderTag} · مسجّل للصرف المجمع`);
    updateStockPanel();
  }
}

/* ---------- KDS — شاشة تحضير المطبخ والبار (توزيع تلقائي حسب قسم الصنف) ---------- */
const ITEM_DEPT_MAP = {
  'لاتيه':'مشروبات ساخنة','كابتشينو':'مشروبات ساخنة','أمريكانو':'مشروبات ساخنة','موكا':'مشروبات ساخنة','اسبريسو':'مشروبات ساخنة','فلات وايت':'مشروبات ساخنة',
  'عصير':'عصائر','مياه':'عصائر',
  'كرواسون':'مطبخ','ساندوتش':'مطبخ','كيك':'مطبخ',
};
const KDS_DEPTS = ['مشروبات ساخنة','عصائر','مطبخ'];
function deptForItem(itemText){
  const key = Object.keys(ITEM_DEPT_MAP).find(k=> itemText.includes(k));
  return key ? ITEM_DEPT_MAP[key] : 'مطبخ';
}
const KDS_STAGES = ['جديد','تحت التحضير','جاهز للتسليم'];
const KDS_SOURCE_ORDERS = [
  {id:'#POS-3318', meta:'كاشير ٢ · تيك أواي', items:['لاتيه وسط ×2','كرواسون'], time:'قبل 1 دقيقة'},
  {id:'#POS-3317', meta:'ت٥ · صالة', items:['كابتشينو وسط','عصير مانجو'], time:'قبل 3 دقائق'},
  {id:'#DLV-902', meta:'Talabat · دليفري', items:['موكا كبير ×2','ساندوتش جبنة'], time:'قبل 4 دقائق'},
  {id:'#POS-3315', meta:'كاشير ١ · تيك أواي', items:['أمريكانو كبير'], time:'قبل 6 دقائق'},
];
let KDS_TICKET_STATE = {}; // key(orderId|dept) -> stage index
function buildKDSTickets(){
  const tickets = [];
  KDS_SOURCE_ORDERS.forEach(o=>{
    const byDept = {};
    o.items.forEach(it=>{ const d = deptForItem(it); (byDept[d]=byDept[d]||[]).push(it); });
    Object.keys(byDept).forEach(dept=>{
      const key = o.id+'|'+dept;
      tickets.push({key, orderId:o.id, dept, items:byDept[dept], meta:o.meta, time:o.time, stage: KDS_TICKET_STATE[key]||0});
    });
  });
  return tickets;
}
function renderKDS(){
  const tickets = buildKDSTickets();
  const cols = KDS_DEPTS.map(dept=>{
    const deptTickets = tickets.filter(t=>t.dept===dept);
    const cards = deptTickets.map(t=>`
      <div class="kticket">
        <div class="kt-top"><span class="kt-id">${t.orderId}</span><span class="platform-badge internal">${KDS_STAGES[t.stage]}</span></div>
        <div class="kt-meta">${t.meta}</div>
        <div class="kt-items">${t.items.map(i=>`• ${i}`).join('<br>')}</div>
        <div class="kt-foot"><span class="kt-time">${t.time}</span>${t.stage<2?`<button class="kticket-advance" onclick="advanceKDS('${t.key}')">${t.stage===0?'بدء التحضير':'تجهيز'} ›</button>`:'<span style="font-size:11px;color:var(--olive-deep);font-weight:800;">✔ جاهز</span>'}</div>
      </div>`).join('') || `<div style="font-size:12px;color:var(--ink-faint);text-align:center;padding:20px 0;">لا توجد طلبات لهذا القسم</div>`;
    return `<div class="kanban-col"><h4>${dept}<span class="count">${deptTickets.length}</span></h4>${cards}</div>`;
  }).join('');
  return `<div class="app-topbar"><div class="right"><div class="crumb">نقاط البيع POS</div><h2 class="screen-title">شاشة تحضير المطبخ والبار (KDS)<small>كل صنف يُوزَّع تلقائيًا لقسم التحضير الخاص به عند وصول الطلب من POS</small></h2></div>
    <div class="left"><span class="meta-pill">فرع المعادي</span></div></div>
    <div class="content-pad"><div class="kanban-board">${cols}</div></div>`;
}

/* ---------- الصرف المجمع (Batch) ---------- */
function renderBatchDispense(){
  const grouped = {};
  BATCH_QUEUE.forEach(q=>{
    const key = q.ingredient;
    grouped[key] = grouped[key] || {qty:0, unit:q.unit, items:new Set()};
    grouped[key].qty += q.qty; grouped[key].items.add(q.item);
  });
  const keys = Object.keys(grouped);
  const rowsHTML = keys.length ? keys.map(k=>{
    const available = POS_STATE.stock[k]!==undefined ? POS_STATE.stock[k] : null;
    const short = available!==null && available < grouped[k].qty;
    const availCell = available!==null ? `${available} ${grouped[k].unit}` : '—';
    return `<tr>${short?'style="background:var(--bad-bg);"':''}<td>${k}</td><td>${[...grouped[k].items].join('، ')}</td>
      <td>${grouped[k].qty} ${grouped[k].unit}</td><td>${availCell}</td>
      <td>${short?`<span class="badge bad">نقص متوقع (${(grouped[k].qty-available).toFixed(0)} ${grouped[k].unit})</span>`:`<span class="badge ok">متاح</span>`}</td>
      <td>${BATCH_QUEUE.filter(q=>q.ingredient===k).length} بند</td></tr>`;
  }).join('')
    : `<tr><td colspan="6" style="text-align:center;color:var(--ink-faint);padding:24px 0;">لا توجد مكونات معلقة حاليًا — بدّلي POS لطريقة "مجمع" وبيعي صنفًا لرؤية القائمة هنا</td></tr>`;
  return `<div class="app-topbar"><div class="right"><div class="crumb">نقاط البيع POS</div><h2 class="screen-title">الصرف المجمع (Batch)<small>مكونات مسجّلة مؤقتًا من مبيعات POS بنمط الصرف المجمع، لم تُخصم من المخزون بعد</small></h2></div>
    <div class="left"><button class="btn primary" onclick="commitBatchDispense()">اعتماد الصرف الآن</button></div></div>
    <div class="content-pad">
      <table class="dtable"><thead><tr><th>المكوّن</th><th>الأصناف المصدرة له</th><th>إجمالي الكمية المعلقة</th><th>المتاح بالمخزون حاليًا</th><th>الحالة</th><th>عدد البنود</th></tr></thead>
      <tbody>${rowsHTML}</tbody></table>
    </div>`;
}
function commitBatchDispense(){
  if(!BATCH_QUEUE.length){ showToast('لا توجد مكونات معلقة للاعتماد'); return; }
  const grouped = {};
  BATCH_QUEUE.forEach(q=> grouped[q.ingredient] = (grouped[q.ingredient]||0) + q.qty);
  const shortages = [];
  Object.keys(grouped).forEach(ing=>{
    const after = (POS_STATE.stock[ing]||0) - grouped[ing];
    if(after < 0) shortages.push(`${ing} (نقص ${Math.abs(after).toFixed(0)} ${UNIT_FOR[ing]||''})`);
    if(POS_STATE.stock[ing]!==undefined) POS_STATE.stock[ing] = Math.max(0, after);
  });
  const count = BATCH_QUEUE.length;

  BATCH_QUEUE = [];
  openScreen('batchDispense');
  if(shortages.length) showToast(`⚠️ تم اعتماد الصرف — لكن رُصد نقص فعلي في: ${shortages.join('، ')}`);
  else showToast(`✔ تم اعتماد صرف ${count} بند بدون أي فروقات`);
}

function checkBranchLimit(branch, item, qty){
  const rec = DB.branchItemLimits.records.find(r=> r.branch===branch && r.item===item);
  if(!rec || !rec.maxOrder) return null;
  const max = parseFloat(rec.maxOrder);
  return (!isNaN(max) && qty>max) ? max : null;
}
function brRequestExceeded(req){ return req.lines.some(l=> checkBranchLimit(req.branch, l.item, l.qty)); }
function renderBranchRequestList(){

function renderBRLines(){
  const branch = document.getElementById('brBranch').value;

  body.innerHTML = BR_LINES.length ? BR_LINES.map((l,i)=>{
    const exceeded = checkBranchLimit(branch, l.item, l.qty);
    return `<tr><td>${l.item}</td><td>${l.qty.toLocaleString('en-US')}</td>
      <td>${exceeded? `<span class="badge bad">يتجاوز الحد الأقصى (${exceeded})</span>` : `<span class="badge ok">ضمن الحد المسموح</span>`}</td>

  const banner = document.getElementById('brLimitBanner');
  if(banner) banner.classList.toggle('show', BR_LINES.some(l=>checkBranchLimit(branch,l.item,l.qty)));
}
function addBranchRequestLine(){
  const item = document.getElementById('brItemSelect').value;
  const qty = parseFloat(document.getElementById('brQtyInput').value);
  if(!qty || qty<=0){ showToast('من فضلك أدخلي كمية صحيحة أكبر من صفر'); return; }
  BR_LINES.push({item, qty});
  const branch = document.getElementById('brBranch').value;
  const exceeded = checkBranchLimit(branch, item, qty);
  renderBRLines();
  showToast(exceeded ? `⚠️ الكمية (${qty}) تتجاوز الحد الأقصى للطلب (${exceeded}) لهذا الصنف في ${branch}` : 'تمت إضافة الصنف للطلب ضمن الحدود المسموحة');

function removeBRLine(idx){ BR_LINES.splice(idx,1); renderBRLines(); }
function saveBranchRequest(){
  if(!BR_LINES.length){ showToast('أضيفي صنف واحد على الأقل قبل الحفظ'); return; }
  const newReq = {
    code:'BR-'+Math.floor(Math.random()*900+1300),
    branch: document.getElementById('brBranch').value,
    priority: document.getElementById('brPriority').value,
    neededDate: document.getElementById('brNeededDate').value ? formatInputDateToDisplay(document.getElementById('brNeededDate').value) : '—',
    reason: document.getElementById('brReason').value.trim() || '—',

  BR_REQUESTS.unshift(newReq);

function approveBranchRequestFull(idx){
  const req = BR_REQUESTS[idx];
  if(brRequestExceeded(req)){ showToast('❗ لا يمكن الاعتماد الكامل تلقائيًا — الطلب متجاوز للحد ويحتاج موافقة إدارية مستقلة'); return; }
  BR_REQUESTS.splice(idx,1);
  openScreen('branchRequest');
  showToast(`✔ تم اعتماد الطلب ${req.code} بالكامل وتحويله للمخزن الرئيسي`);
}
function rejectBranchRequest(idx){
  const req = BR_REQUESTS[idx];
  BR_REQUESTS.splice(idx,1);

}

      </div>
      ${diff!==0?`<button class="btn primary" style="margin-top:14px;" onclick="postBankDiffEntry()">ترحيل قيد تسوية الفرق (${diff.toLocaleString('en-US')} ج.م)</button>`:''}

  showToast('تم إنشاء قيد تسوية آلي للفرق ونقله للقيود اليومية كمسودة بانتظار المراجعة');
}
function autoMatchBank(){
  let count=0;
  BANK_RECON.system.forEach(s=>{
    if(s.matched) return;
    const t = BANK_RECON.statement.find(t=>!t.matched && t.amount===s.amount);
    if(t){ s.matched=true; t.matched=true; count++; }
  });
  openScreen('bankReconcile');
  showToast(count? `تمت مطابقة ${count} حركة تلقائيًا (متطابقة في القيمة)` : 'لا توجد حركات متطابقة تلقائيًا في القيمة');
}
function manualMatchBank(){
  const sysChecked = [...document.querySelectorAll('.rc-check[data-side="sys"]:checked')].map(el=>el.dataset.id);
  const stmtChecked = [...document.querySelectorAll('.rc-check[data-side="stmt"]:checked')].map(el=>el.dataset.id);
  if(sysChecked.length!==1 || stmtChecked.length!==1){ showToast('اختاري حركة واحدة بالضبط من كل جانب للمطابقة اليدوية'); return; }
  const s = BANK_RECON.system.find(x=>x.id===sysChecked[0]);
  const t = BANK_RECON.statement.find(x=>x.id===stmtChecked[0]);
  s.matched = true; t.matched = true;
  openScreen('bankReconcile');
  showToast('تمت المطابقة اليدوية بنجاح');
}

function toggleCOA(code){
  const idx = COA_TREE.findIndex(n=>n.code===code);
  const level = COA_TREE[idx].level;
  const btn = document.getElementById('toggle-'+slug(code));
  const collapsing = btn.textContent==='▾';
  let i = idx+1;
  while(i<COA_TREE.length && COA_TREE[i].level>level){
    const tr = document.querySelector(`tr[data-code="${COA_TREE[i].code}"]`);
    if(tr) tr.style.display = collapsing ? 'none' : '';
    i++;
  }
  btn.textContent = collapsing ? '▸' : '▾';
}

      </form>

    code:n.code, nameAr:n.nameAr, accountType:n.type, nature:n.nature,
    postable: n.postable?'نعم':'لا', defaultCostCenter: n.cc && n.cc!=='—' ? n.cc : '—',
    openingBalance: n.balance!==null ? n.balance : '',
  };
  if(parentCode){
    const pNode = COA_TREE.find(x=>x.code===parentCode);
    if(pNode) values.parent = `${pNode.code} — ${pNode.nameAr}`;
  }
  schema.sections.forEach(s=> s.fields.forEach(f=>{
    const el = document.getElementById(`cf-${f.k}`);
    if(!el || values[f.k]===undefined) return;
    if(f.type==='toggle') el.checked = values[f.k]==='نعم';
    else el.value = values[f.k];
  }));
}
function submitCOAEdit(code){
  const n = COA_TREE.find(x=>x.code===code);
  if(!n) return;
  const schema = FORM_SCHEMAS.coa;
  const values = {};
  schema.sections.forEach(s=> s.fields.forEach(f=>{
    const el = document.getElementById(`cf-${f.k}`);
    if(!el) return;
    values[f.k] = f.type==='toggle' ? (el.checked?'نعم':'لا') : (el.value||'').trim();
  }));
  if(values.nameAr) n.nameAr = values.nameAr;
  if(values.accountType) n.type = values.accountType;
  if(values.nature) n.nature = values.nature;
  n.postable = values.postable==='نعم';
  n.cc = (values.defaultCostCenter && values.defaultCostCenter!=='—') ? values.defaultCostCenter : '—';
  if(values.openingBalance!=='') n.balance = parseFloat(values.openingBalance);
  openScreen('coa');
  showToast(`تم حفظ تعديلات الحساب ${n.code} بنجاح`);
}

/* ---------- إقفال فترة مالية — Checklist تفاعلي ---------- */
function computePeriodChecks(){
  const draftJournals = DB.journal.rows.filter(r=> String(r[7]||r[5]).includes('مسودة')).length;
  const bankUnmatched = BANK_RECON.system.filter(r=>!r.matched).length + BANK_RECON.statement.filter(r=>!r.matched).length;
  const openCustodies = OPEN_CUSTODIES.length;
  const openShifts = 6;
  const unpostedInvoices = 2;
  return [
    {label:'ترحيل جميع القيود (لا توجد قيود مسودة)', pass: draftJournals===0, detail: draftJournals+' قيد مسودة'},
    {label:'تسوية جميع العهد المفتوحة', pass: openCustodies===0, detail: openCustodies+' عهدة مفتوحة'},
    {label:'مطابقة الخزائن والبنوك', pass: bankUnmatched===0, detail: bankUnmatched+' حركة بنكية غير مطابقة'},
    {label:'إغلاق جميع الورديات المفتوحة', pass: openShifts===0, detail: openShifts+' وردية مفتوحة'},
    {label:'ترحيل جميع فواتير المشتريات والمبيعات', pass: unpostedInvoices===0, detail: unpostedInvoices+' فاتورة غير مرحلة'},
  ];
}
function renderPeriodClose(){
  const checks = computePeriodChecks();
  const allPass = checks.every(c=>c.pass);
  const rows = checks.map(c=>`<div class="srow"><span class="s-label">${c.pass?'✅':'❌'} ${c.label}</span><span class="s-value" style="color:${c.pass?'var(--olive-deep)':'var(--rust-deep)'}">${c.detail}</span></div>`).join('');
  return `<div class="app-topbar"><div class="right"><div class="crumb">الحسابات العامة</div><h2 class="screen-title">إقفال فترة مالية<small>أغسطس 2026 — 01/08 حتى 31/08/2026</small></h2></div>
    <div class="left">${allPass?b('جاهزة للإقفال'):b('غير جاهزة')}<button class="btn">تصدير تقرير ما قبل الإقفال</button><button class="btn primary" onclick="attemptPeriodClose()">إقفال الفترة</button></div></div>
    <div class="content-pad">
      <div class="panel"><h4>التحقق قبل الإقفال (12.3)</h4><div class="shift-rows">${rows}</div></div>
    </div>`;
}
function attemptPeriodClose(){
  const checks = computePeriodChecks();
  const failed = checks.filter(c=>!c.pass);
  if(failed.length){ showToast(`❗ لا يمكن إقفال الفترة — ${failed.length} تحقق غير مكتمل: ${failed.map(f=>f.label).join('، ')}`); return; }
  showToast('✔ تم إقفال الفترة بنجاح — لا يمكن التعديل عليها إلا بصلاحية خاصة');
}

/* ---------- صلاحيات المستخدمين على الشاشات والحقول ---------- */
const PERM_MODULES = ['الحسابات العامة','المخازن والتصنيع','المشتريات','المبيعات','نقاط البيع POS','الامتثال الضريبي (ETA)','الإعدادات والصلاحيات','التقارير','الصيانة وإدارة الأعطال'];
const SENSITIVE_FIELDS = ['رصيد الخزينة الفعلي','بيانات دفع العميل (رقم البطاقة/المحفظة)','رقم هاتف العميل الكامل','راتب أو عمولة الموظف','التكلفة الفعلية للصنف','الرصيد البنكي'];
let USER_MODULE_PERMS = {
  'مروة عادل': {'نقاط البيع POS':{view:true,add:true,edit:false,del:false}},
  'أحمد سامي': PERM_MODULES.reduce((o,m)=>{o[m]={view:true,add:true,edit:true,del:m==='الإعدادات والصلاحيات'?false:true};return o;},{}),
};
let USER_FIELD_PERMS = {
  'مروة عادل': {'رصيد الخزينة الفعلي':false,'بيانات دفع العميل (رقم البطاقة/المحفظة)':false,'رقم هاتف العميل الكامل':true,'راتب أو عمولة الموظف':false,'التكلفة الفعلية للصنف':false,'الرصيد البنكي':false},
  'أحمد سامي': {'رصيد الخزينة الفعلي':true,'بيانات دفع العميل (رقم البطاقة/المحفظة)':false,'رقم هاتف العميل الكامل':true,'راتب أو عمولة الموظف':false,'التكلفة الفعلية للصنف':true,'الرصيد البنكي':true},
};
let UFA_CURRENT_USER = 'مروة عادل';
function getModulePerm(user, mod){ return (USER_MODULE_PERMS[user] && USER_MODULE_PERMS[user][mod]) || {view:false,add:false,edit:false,del:false}; }
function getFieldPerm(user, field){ return (USER_FIELD_PERMS[user] && USER_FIELD_PERMS[user][field]) || false; }
function renderUserFieldAccess(){
  const userOpts = SCOPE_USERS.map(u=>`<option ${u===UFA_CURRENT_USER?'selected':''}>${u}</option>`).join('');
  const modRows = PERM_MODULES.map(mod=>{
    const p = getModulePerm(UFA_CURRENT_USER, mod);
    const cb = (key,checked)=>`<label class="switch"><input type="checkbox" class="ufa-mod" data-mod="${mod}" data-key="${key}" ${checked?'checked':''}><span class="slider"></span></label>`;
    return `<tr><td>${mod}</td><td>${cb('view',p.view)}</td><td>${cb('add',p.add)}</td><td>${cb('edit',p.edit)}</td><td>${cb('del',p.del)}</td></tr>`;
  }).join('');
  const fieldRows = SENSITIVE_FIELDS.map(f=>{
    const checked = getFieldPerm(UFA_CURRENT_USER, f);
    return `<div class="switch-row"><div><div class="switch-label">${f}</div><div class="switch-help">صلاحية مستقلة على مستوى الحقل نفسه — مش مرتبطة بصلاحية الشاشة بالكامل.</div></div>
      <label class="switch"><input type="checkbox" class="ufa-field" data-field="${f}" ${checked?'checked':''}><span class="slider"></span></label></div>`;
  }).join('');
  return `<div class="app-topbar"><div class="right"><div class="crumb">الإعدادات والصلاحيات</div><h2 class="screen-title">صلاحيات المستخدمين على الشاشات والحقول<small>صلاحيات عرض/إضافة/تعديل/حذف لكل موديول، وصلاحيات مستقلة للحقول الحساسة (Field-Level)</small></h2></div>
    <div class="left"><select id="ufaUserSelect" onchange="switchUFAUser(this.value)">${userOpts}</select><button class="btn primary" onclick="saveUserFieldAccess()">حفظ الصلاحيات</button></div></div>
    <div class="content-pad">
      <div class="panel" style="margin-bottom:18px;">
        <h4>صلاحيات الموديولات</h4>
        <table class="dtable"><thead><tr><th>الموديول</th><th>عرض</th><th>إضافة</th><th>تعديل</th><th>حذف</th></tr></thead><tbody>${modRows}</tbody></table>
      </div>
      <div class="panel">
        <h4>الحقول الحساسة (Field-Level Permissions)</h4>
        ${fieldRows}
      </div>
    </div>`;
}
function switchUFAUser(user){ UFA_CURRENT_USER = user; openScreen('userFieldAccess'); }
function saveUserFieldAccess(){
  const user = UFA_CURRENT_USER;
  USER_MODULE_PERMS[user] = USER_MODULE_PERMS[user] || {};
  document.querySelectorAll('.ufa-mod').forEach(el=>{
    const mod = el.dataset.mod, key = el.dataset.key;
    USER_MODULE_PERMS[user][mod] = USER_MODULE_PERMS[user][mod] || {view:false,add:false,edit:false,del:false};
    USER_MODULE_PERMS[user][mod][key] = el.checked;
  });
  USER_FIELD_PERMS[user] = USER_FIELD_PERMS[user] || {};
  document.querySelectorAll('.ufa-field').forEach(el=>{ USER_FIELD_PERMS[user][el.dataset.field] = el.checked; });
  showToast(`تم حفظ صلاحيات "${user}" بنجاح`);
}

const MNT_STAGES = ['مُبلّغ','قيد الفحص','قيد الإصلاح','تم الإصلاح'];

  {id:'ISS-041', device:'ماكينة إسبريسو رقم 2', branch:'فرع المعادي', desc:'تسريب مياه من الغلاية', stage:1, time:'منذ يوم'},

function renderMaintenanceTracking(){
  const cols = MNT_STAGES.map((label,si)=>{
    const cards = MNT_TICKETS.filter(t=>t.stage===si).map(t=>`
      <div class="kticket">
        <div class="kt-top"><span class="kt-id">${t.id}</span><span class="platform-badge internal">${t.branch}</span></div>
        <div class="kt-meta">${t.device}</div>
        <div class="kt-items">${t.desc}</div>
        <div class="kt-foot"><span class="kt-time">${t.time}</span>${si<3?`<button class="kticket-advance" onclick="advanceMNT('${t.id}')">نقل للتالي ›</button>`:'<span style="font-size:11px;color:var(--olive-deep);font-weight:800;">✔ تم</span>'}</div>
      </div>`).join('') || `<div style="font-size:12px;color:var(--ink-faint);text-align:center;padding:20px 0;">لا توجد بلاغات</div>`;
    return `<div class="kanban-col"><h4>${label}<span class="count">${MNT_TICKETS.filter(t=>t.stage===si).length}</span></h4>${cards}</div>`;
  }).join('');
  return `<div class="app-topbar"><div class="right"><div class="crumb">الصيانة وإدارة الأعطال</div><h2 class="screen-title">متابعة حالة الإصلاح<small>بلاغات الأعطال وطلبات الصيانة في مكان واحد</small></h2></div>
    <div class="left"><button class="btn primary" onclick="openCreatePage('maintenanceIssues')">+ بلاغ عطل جديد</button></div></div>
    <div class="content-pad"><div class="kanban-board">${cols}</div></div>`;
}
function advanceMNT(id){
  const t = MNT_TICKETS.find(x=>x.id===id);
  if(t && t.stage<3){ t.stage++; openScreen('maintenanceTracking'); showToast(`تم تحديث حالة ${id} إلى "${MNT_STAGES[t.stage]}"`); }
}

/* ---------- تقارير تفاعلية بفلاتر ورسوم ---------- */
function renderReport(id){
  const cfg = DB[id];
  const maxVal = Math.max(...cfg.chart.map(c=>Math.abs(c[1]))) || 1;
  const bars = cfg.chart.map(([label,val])=>`
    <div class="barrow"><div class="b-label">${label}</div><div class="b-track"><div class="b-fill" style="width:${Math.round((Math.abs(val)/maxVal)*100)}%;${val<0?'background:var(--rust-deep);':''}"></div></div><div class="b-val">${val.toLocaleString('en-US')}${cfg.chartSuffix}</div></div>`).join('');
  const table = `<table class="dtable"><thead><tr>${cfg.columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${cfg.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  return `<div class="app-topbar"><div class="right"><div class="crumb">${cfg.crumb}</div><h2 class="screen-title">${cfg.title}<small>${cfg.subtitle}</small></h2></div>
    <div class="left"><button class="btn">تصدير Excel</button><button class="btn primary">تصدير PDF</button></div></div>
    <div class="content-pad">
      <div class="report-filters">

/* fallback: فورم عام أفضل من مجرد أعمدة الجدول — لتصنيف نوع الحقل تلقائيًا */
function genericSchema(cfg){
  const fields = cfg.columns.map((c,idx)=>{
    const k = 'g'+idx;
    if(c==='الحالة') return {k, label:c, type:'select', options:['فعال','متوقف','مسودة','بانتظار الاعتماد']};
    if(/تاريخ/.test(c)) return {k, label:c, type:'date'};
    if(/(نسبة|كمية|سعر|مبلغ|رصيد|حد|عدد|قيمة|عمولة)/.test(c)) return {k, label:c, type:'number'};
    return {k, label:c, type:'text'};
  });
  return {
    sections:[{name:'بيانات '+cfg.title, fields}],
    rowFrom: v => cfg.columns.map((c,idx)=>{
      const val = v['g'+idx] || '—';
      return c==='الحالة' ? b(val) : val;
    })
  };
}

function fieldHTML(f){
  const fid = `cf-${f.k}`;
  if(f.type==='toggle'){
    return `<div class="switch-row"><div><div class="switch-label">${f.label}</div>${f.help?`<div class="switch-help">${f.help}</div>`:''}</div>
      <label class="switch"><input type="checkbox" id="${fid}" ${f.default?'checked':''}><span class="slider"></span></label></div>`;
  }
  const spanClass = f.span==='full' ? 'full' : '';
  if(f.type==='select'){
    return `<div class="cform-field ${spanClass}"><label for="${fid}">${f.label}${f.required?' *':''}</label>
      <select id="${fid}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>
      ${f.help?`<div class="field-help">${f.help}</div>`:''}</div>`;
  }
  const type = f.type==='number' ? 'number' : (f.type==='date' ? 'date' : 'text');
  return `<div class="cform-field ${spanClass}"><label for="${fid}">${f.label}${f.required?' *':''}</label>
    <input type="${type}" id="${fid}" placeholder="${f.placeholder||''}">
    ${f.help?`<div class="field-help">${f.help}</div>`:''}</div>`;
}

  if(id==='journal') return renderJournalCreate();

function submitCreatePage(id){
  const cfg = DB[id];
  const schema = FORM_SCHEMAS[id] || genericSchema(cfg);
  const values = {};
  schema.sections.forEach(s=> s.fields.forEach(f=>{
    const el = document.getElementById(`cf-${f.k}`);
    if(!el) return;
    values[f.k] = f.type==='toggle' ? (el.checked ? 'نعم':'لا') : (el.value||'').trim();
  }));
  if(id==='productionSalesModes'){
    if(values.level==='الفرع') cfg.branchRows.unshift([values.entity||'—', values.mode||'—', 'متوسط']);
    else if(values.level==='نقطة بيع') cfg.posRows.unshift([values.entity||'—', values.dispenseMethod||'— غير منطبق —']);
    else cfg.itemRows.unshift([values.entity||'—', values.mode||'—', values.dispenseMethod||'— غير منطبق —', 'الأعلى']);
    openScreen(id);
    showToast('تم إضافة الاستثناء بنجاح');
    return;
  }
  if(id==='ccAccountLink'){
    CC_ACCOUNT_LINKS.push({account:values.account||'—', dimension:values.dimension||'—', order:parseInt(values.order)||1, mandatory:values.mandatory==='نعم', isDefault:values.isDefault==='نعم'});
    openScreen('ccAccountLink');
    showToast('تم إضافة الربط بنجاح');
    return;
  }
  if(id==='coa'){
    const parentCode = (values.parent||'').split(' ')[0];
    const parentIdx = COA_TREE.findIndex(n=>n.code===parentCode);
    const level = parentIdx>=0 ? COA_TREE[parentIdx].level+1 : 0;
    const newNode = {code:values.code||('NEW-'+Math.floor(Math.random()*900+100)), nameAr:values.nameAr||'حساب جديد',
      level, type:values.accountType||'أصول', nature:values.nature||'مدين', postable:values.postable==='نعم',
      cc: values.defaultCostCenter && values.defaultCostCenter!=='—' ? values.defaultCostCenter : '—',
      balance: values.openingBalance ? parseFloat(values.openingBalance) : 0};
    if(parentIdx>=0){
      let insertAt = parentIdx+1;
      while(insertAt<COA_TREE.length && COA_TREE[insertAt].level>COA_TREE[parentIdx].level) insertAt++;
      COA_TREE.splice(insertAt, 0, newNode);
    } else {
      COA_TREE.push(newNode);
    }
    openScreen('coa');
    showToast('تم إنشاء الحساب وإضافته للشجرة');
    return;
  }
  if(cfg.records){
    cfg.records.unshift(values);
  } else {
    const row = schema.rowFrom ? schema.rowFrom(values) : cfg.columns.map(()=>'—');
    cfg.rows.unshift(row);
  }
  openScreen(id);
  showToast(`تم إنشاء السجل في «${cfg.title}» بنجاح`);
}

/* ---------- قيد يومية يدوي — مدين/دائن حقيقي ومتوازن ---------- */
const JOURNAL_ACCOUNTS = ['1110-01 — خزينة فرع المعادي','1130-01 — شركة نور للفنادق','2110-01 — شركة البن الذهبي','4100 — مبيعات القهوة','5100 — تكلفة البضاعة المباعة'];
let JOURNAL_LINES = [];
function accNameOf(fullText){ return fullText && fullText.includes(' — ') ? fullText.split(' — ')[1] : (fullText||''); }
function computeMaxDims(){
  return JOURNAL_LINES.reduce((max,line)=>{
    const n = CC_ACCOUNT_LINKS.filter(l=>l.account===accNameOf(line.account)).length;
    return Math.max(max, n);
  }, 0);
}
function renderJournalLinesTable(){
  const maxDims = computeMaxDims();
  const theadExtra = Array.from({length:maxDims}, (_,i)=>`<th>بُعد ${i+1}</th>`).join('');
  const rowsHTML = JOURNAL_LINES.map((line, idx)=>{
    const accOptions = `<option value="">— اختر حساب —</option>` + JOURNAL_ACCOUNTS.map(a=>`<option ${a===line.account?'selected':''}>${a}</option>`).join('');
    const links = CC_ACCOUNT_LINKS.filter(l=>l.account===accNameOf(line.account)).sort((a,b)=>a.order-b.order);
    let dimCells = '';
    for(let i=0;i<maxDims;i++){
      const link = links[i];
      if(link){
        const opts = `<option value="">--</option>` + (CC_DIMENSIONS[link.dimension]||[]).map(o=>`<option ${o===line.ccValues[link.dimension]?'selected':''}>${o}</option>`).join('');
        dimCells += `<td><label style="font-size:9.5px;color:var(--ink-faint);display:block;white-space:nowrap;">${link.dimension}${link.mandatory?' *':''}</label>
          <select class="jcc-dim" data-mandatory="${link.mandatory}" data-dim="${link.dimension}" onchange="JOURNAL_LINES[${idx}].ccValues['${link.dimension}']=this.value">${opts}</select></td>`;
      } else {
        dimCells += `<td style="background:var(--paper-dim);"></td>`;
      }
    }
    return `<tr data-line="${idx}">
      <td><select onchange="onJournalAccountSelect(${idx}, this.value)">${accOptions}</select></td>
      <td><input type="text" placeholder="بيان السطر" value="${line.desc||''}" oninput="JOURNAL_LINES[${idx}].desc=this.value"></td>
      ${dimCells}
      <td><input type="number" placeholder="0.00" class="jdebit" value="${line.debit||''}" oninput="JOURNAL_LINES[${idx}].debit=this.value;updateJournalBalance()"></td>
      <td><input type="number" placeholder="0.00" class="jcredit" value="${line.credit||''}" oninput="JOURNAL_LINES[${idx}].credit=this.value;updateJournalBalance()"></td>
      <td><button type="button" class="row-edit-btn" onclick="removeJournalLine(${idx})">حذف</button></td>
    </tr>`;
  }).join('');
  const wrap = document.getElementById('journalLinesWrap');
  if(!wrap) return;
  wrap.innerHTML = `<table class="jrow-table"><thead><tr><th>الحساب</th><th>البيان</th>${theadExtra}<th>مدين</th><th>دائن</th><th></th></tr></thead><tbody>${rowsHTML}</tbody></table>`;
  updateJournalBalance();
}
function onJournalAccountSelect(idx, val){
  JOURNAL_LINES[idx].account = val;
  JOURNAL_LINES[idx].ccValues = {};
  renderJournalLinesTable();
}
function addJournalLine(){
  JOURNAL_LINES.push({account:'', desc:'', debit:'', credit:'', ccValues:{}});
  renderJournalLinesTable();
}
function removeJournalLine(idx){
  if(JOURNAL_LINES.length<=1){ showToast('لازم يفضل سطر واحد على الأقل'); return; }
  JOURNAL_LINES.splice(idx,1);
  renderJournalLinesTable();
}

function updateJournalBalance(){
  const debits = [...document.querySelectorAll('.jdebit')].reduce((s,el)=>s+(parseFloat(el.value)||0),0);
  const credits = [...document.querySelectorAll('.jcredit')].reduce((s,el)=>s+(parseFloat(el.value)||0),0);
  const debitEl = document.getElementById('jDebitSum'), creditEl = document.getElementById('jCreditSum');
  if(!debitEl) return;
  debitEl.textContent = debits.toFixed(2);
  creditEl.textContent = credits.toFixed(2);
  const bar = document.getElementById('jBalBar'), status = document.getElementById('jBalStatus');
  const balanced = debits>0 && debits===credits;
  bar.className = 'jbal-bar ' + (balanced ? 'balanced' : 'unbalanced');
  status.textContent = balanced ? '✔ متوازن — جاهز للترحيل' : '❗ غير متوازن';
}
function submitJournalCreate(editIdx){
  const debits = [...document.querySelectorAll('.jdebit')].reduce((s,el)=>s+(parseFloat(el.value)||0),0);
  const credits = [...document.querySelectorAll('.jcredit')].reduce((s,el)=>s+(parseFloat(el.value)||0),0);
  if(debits===0 || debits!==credits){
    showToast('⚠️ لا يمكن ترحيل قيد غير متوازن — راجعي إجمالي المدين والدائن');
    return;
  }
  const missingDims = [...document.querySelectorAll('.jcc-dim')].filter(el=> el.dataset.mandatory==='true' && !el.value);
  if(missingDims.length){
    const names = [...new Set(missingDims.map(el=>el.dataset.dim))].join('، ');
    showToast(`⚠️ لازم تحددي أبعاد مركز التكلفة الإلزامية أولاً: ${names}`);
    return;
  }
  const desc = document.getElementById('jDesc').value || 'قيد يدوي';
  const dateVal = document.getElementById('jDate').value || '31/08/2026';
  const isEdit = editIdx!==undefined && editIdx!==null && !isNaN(editIdx);
  if(isEdit){
    const oldCode = DB.journal.rows[editIdx][0];
    DB.journal.rows[editIdx] = [oldCode, dateVal, desc, '— يدوي —', b('يدوي'), debits.toFixed(2), credits.toFixed(2), b('مسودة')];
    openScreen('journal');
    showToast('تم حفظ التعديلات على القيد — لسه مسودة وهيحتاج ترحيل نهائي');
  } else {
    DB.journal.rows.unshift(['JV-'+Math.floor(Math.random()*9000+1000), dateVal, desc, '— يدوي —', b('يدوي'), debits.toFixed(2), credits.toFixed(2), b('مسودة')]);
    openScreen('journal');
    showToast('تم إنشاء القيد كمسودة — يحتاج ترحيل نهائي بصلاحية مستقلة');
  }
}

function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast" id="toastEl">${msg}</div>`;
  requestAnimationFrame(()=>{ const t=document.getElementById('toastEl'); if(t) t.classList.add('show'); });
  setTimeout(()=>{ const t=document.getElementById('toastEl'); if(t){ t.classList.remove('show'); setTimeout(()=>{root.innerHTML='';},200); } }, 3200);
}
function openScreen(id){
  CURRENT_SCREEN_ID = id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  const cfg = DB[id];
  let html='';
  if(id==='dashboard') html = renderDashboard();
  else if(id==='posSale') html = renderPOS();
  else if(id==='tablesScreen') html = renderTables();
  else if(id==='shiftClose') html = renderShiftClose();
  else if(id==='kdsScreen') html = renderKDS();
  else if(id==='deliveryOrders') html = renderDeliveryPipeline();
  else if(id==='batchDispense') html = renderBatchDispense();
  else if(id==='productionSalesModes') html = renderProductionModesSettings();
  else if(id==='branchRequest') html = renderBranchRequestList();
  else if(id==='approveRequest') html = renderApproveRequestList();
  else if(id==='custodySettle') html = renderCustodySettle();
  else if(id==='bankReconcile') html = renderBankReconcile();
  else if(id==='maintenanceTracking') html = renderMaintenanceTracking();
  else if(id==='coa') html = renderCOATree();
  else if(id==='periodClose') html = renderPeriodClose();
  else if(id==='ccAccountLink') html = renderCCAccountLink();
  else if(id==='userScopeAccess') html = renderUserScopeAccess();
  else if(id==='userFieldAccess') html = renderUserFieldAccess();
  else if(cfg.isReport) html = renderReport(id);
  else if(cfg.type==='list') html = renderList(cfg, id);
  else if(cfg.type==='doc') html = renderDoc(cfg);
  mainArea.innerHTML = html;
  mainArea.scrollTop = 0;
  wireInteractions(id);
}

function wireInteractions(id){
  document.querySelectorAll('.order-type button').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.order-type button').forEach(x=>x.classList.remove('on')); btn.classList.add('on');
  }));
  document.querySelectorAll('.cat-tabs button').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-tabs button').forEach(x=>x.classList.remove('on')); btn.classList.add('on');
  }));
  document.querySelectorAll('.tchip-lg.free, .tchip-lg.busy').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.tchip-lg').forEach(x=>x.style.outline=''); btn.style.outline='3px solid var(--gold)'; btn.style.outlineOffset='2px';
  }));
}

/* ===================== شاشة تسجيل الدخول (ثنائية اللغة) ===================== */
const LOGIN_I18N = {
  ar:{ title:'تسجيل الدخول', subtitle:'مرحبًا بعودتك — سجّلي الدخول لمتابعة العمل', company:'الشركة', companyOpt:'شركة الحبّاك للتجارة',
       username:'اسم المستخدم أو البريد الإلكتروني', userPh:'مثال: marwa.adel', password:'كلمة المرور', passPh:'••••••••',
       remember:'تذكرني', forgot:'نسيت كلمة المرور؟', submit:'تسجيل الدخول', langBtn:'English', footer:'الحبّاك — قهوة … تبسطك' },
  en:{ title:'Sign In', subtitle:'Welcome back — sign in to continue', company:'Company', companyOpt:'Al Habbak Trading Co.',
       username:'Username or Email', userPh:'e.g. marwa.adel', password:'Password', passPh:'••••••••',
       remember:'Remember me', forgot:'Forgot password?', submit:'Sign In', langBtn:'العربية', footer:'Al Habbak — Coffee … that pleases you' },
};
let LOGIN_LANG = 'ar';
function renderLogin(){
  const t = LOGIN_I18N[LOGIN_LANG];
  document.documentElement.dir = LOGIN_LANG==='ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = LOGIN_LANG;
  document.getElementById('loginGate').innerHTML = `
    <div class="login-gate">
      <div class="login-card">
        <div class="login-head">
          <div class="login-lang-pill" onclick="toggleLoginLang()">${t.langBtn}</div>
          <div class="login-logo brand-logo-img"></div>
          <h2>${t.title}</h2>
          <p>${t.subtitle}</p>
        </div>
        <div class="login-body">
          <div class="login-field"><label>${t.company}</label><select><option>${t.companyOpt}</option></select></div>
          <div class="login-field"><label>${t.username}</label><input type="text" placeholder="${t.userPh}"></div>
          <div class="login-field"><label>${t.password}</label><input type="password" placeholder="${t.passPh}"></div>
          <div class="login-row">
            <label><input type="checkbox" checked> ${t.remember}</label>
            <a href="#" onclick="return false;">${t.forgot}</a>
          </div>
          <button class="login-submit" onclick="doLogin()">${t.submit}</button>
          <div class="login-footer">${t.footer}</div>
        </div>
      </div>
    </div>`;
}
function toggleLoginLang(){ LOGIN_LANG = LOGIN_LANG==='ar' ? 'en' : 'ar'; renderLogin(); }
function doLogin(){
  document.documentElement.dir = 'rtl';
  document.documentElement.lang = 'ar';
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('loginGate').innerHTML = '';
  document.getElementById('appShell').style.display = 'flex';
  openScreen('dashboard');
}

renderLogin();
</script>
